# Đăng ảnh, clip, ảnh đại diện của cn49a.vn lên GitHub Pages.
# Trang nặng vài trăm MB → cho bước đăng chờ tối đa 30 phút (mặc định 10 phút hay bị huỷ giữa chừng).
name: Đăng ảnh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
